<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4cee4c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006644;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="battGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00aa66;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#004433;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Battery body outline -->
  <path d="M220 60 L220 30 Q220 20 230 20 L290 20 Q300 20 300 30 L300 60
           L340 60 Q380 60 380 100 L380 420 Q380 460 340 460 L140 460 Q100 460 100 420 L100 100 Q100 60 140 60 Z"
        fill="none" stroke="url(#battGrad)" stroke-width="26" stroke-linejoin="round"/>

  <!-- Leaf -->
  <path d="M195 430 Q130 350 150 240 Q160 160 240 130 Q260 122 270 140
           Q310 200 290 290 Q275 360 200 410 Z"
        fill="url(#leafGrad)" opacity="0.95"/>
  <!-- Leaf vein -->
  <path d="M202 425 Q190 350 210 270 Q225 200 258 148"
        fill="none" stroke="white" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  <path d="M202 380 Q225 355 250 340" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <path d="M205 330 Q230 310 255 300" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.4"/>

  <!-- </> code symbol -->
  <g fill="url(#battGrad)" opacity="0.92">
    <!-- < -->
    <path d="M270 230 L310 205 L310 220 L285 235 L310 250 L310 265 L270 240 Z"/>
    <!-- > -->
    <path d="M330 205 L370 230 L370 240 L330 265 L330 250 L355 235 L330 220 Z"/>
    <!-- / -->
    <rect x="316" y="198" width="9" height="74" rx="4"
          transform="rotate(-15 320 235)"/>
  </g>

  <!-- Circuit connector bottom -->
  <path d="M240 460 L240 480 Q240 490 250 490 L262 490 Q272 490 272 480 L272 460"
        fill="none" stroke="url(#battGrad)" stroke-width="14" stroke-linecap="round"/>
  <circle cx="262" cy="498" r="10" fill="url(#battGrad)"/>
</svg>
