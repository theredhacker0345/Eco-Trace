name: Release EcoTrace

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v1.0.0)'
        required: true
        default: 'v0.1.0'

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust (MSVC toolchain)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true

      - name: Install Node dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'EcoTrace ${{ github.ref_name }}'
          releaseBody: |
            ## EcoTrace ${{ github.ref_name }}

            ### How to install
            1. Download `EcoTrace_*_x64-setup.exe` below
            2. Run the installer — if Windows SmartScreen appears, click **"More info" → "Run anyway"**
               (expected for unsigned apps)
            3. Launch EcoTrace from the Start Menu or Desktop shortcut

            ### Files
            | File | Description |
            |------|-------------|
            | `EcoTrace_*_x64-setup.exe` | NSIS installer — recommended |
            | `EcoTrace_*_x64_en-US.msi` | MSI installer — alternative |

            ### Requirements
            - Windows 10/11 (64-bit)
            - ADB installed and in PATH (for dynamic profiling)
            - Android device with USB debugging enabled (optional)
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false
