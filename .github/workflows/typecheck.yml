name: TypeScript Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      # A workflow with invalid YAML is not a build failure anyone notices --
      # GitHub reports it as a syntax error at dispatch time, so the file sits
      # there looking correct until somebody needs it. That is how a release
      # workflow stayed broken through several pushes without anyone finding
      # out. This step is the reason that cannot happen again.
      - name: Validate GitHub Actions workflows
        run: npm run workflow:lint
