name: TypeScript Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

      # A workflow with invalid YAML is not a build failure anyone notices --
      # GitHub reports it as a syntax error at dispatch time, so the file sits
      # there looking correct until somebody needs it. That is how a release
      # workflow stayed broken through several pushes without anyone finding
      # out. This step is the reason that cannot happen again.
      - name: Validate GitHub Actions workflows
        run: npm run workflow:lint

      # The analyzer's contract with its own corpus: every rule the demo and the
      # test fixture document must still fire, nothing undocumented may fire in
      # them, the clean files stay silent, and the known-false-positive cases
      # (an import mistaken for a use, a permission check mistaken for a request)
      # stay quiet. This is the check that a detector tightening loses.
      - name: Analyzer precision check
        run: npm run analyzer:check
