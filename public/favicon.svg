<svg width="16" height="16" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262626"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#a6c8ff"/>
      <stop offset="55%" stop-color="#4589ff"/>
      <stop offset="100%" stop-color="#0f62fe"/>
    </linearGradient>
  </defs>

  <!-- Rounded plate. Tauri masks corners on some platforms, so the plate is
       inset from the canvas rather than bleeding to the edge. -->
  <rect x="0" y="0" width="16" height="16" rx="3.2" fill="url(#bg)"/>

  <!-- The bolt, scaled up and centred on the plate. -->
  <g transform="translate(8 8) scale(0.66) translate(-8 -8)">
    <path d="M9.4 1 2.6 8.7h4.2L5.2 15 13.4 6.4H8.7z" fill="url(#bolt)"/>
  </g>
</svg>
